</style></head><body><main id="app"></main><script>
const dims=['可接近感','好感信号','互动回声','情绪可读','筛选门槛','独立轨道'];
const desc=['别人是否容易自然地与你开启互动','喜欢一个人时，你的表达是否容易被识别','对方主动以后，能否收到你的回应','你的感受、态度和边界是否容易理解','进入关系前，你需要多少观察和确认','你维持个人生活与节奏的程度'];
const raw=[
[0,'朋友聚会上，有个你愿意认识的人坐在旁边。你通常会？','想象你当时最自然的举动。',['先做自己的事，等对方开口','偶尔看过去，给一点微笑','找到共同话题，自然接上几句','主动打招呼，让聊天开始']],
[1,'你发现自己对一个人有好感，会怎样让TA察觉？','选你实际会做的，而非希望自己做到的。',['尽量表现得和平常一样','记住细节，但很少表达','会夸TA，也会制造单独相处的机会','会明确表达想进一步了解TA']],
[2,'喜欢的人分享了一件日常小事，你有空时更可能？','这里关注互动投入，不比较回复快慢。',['简单回应，很少接着聊','回应内容，等TA继续','问一个相关问题，让话题延续','认真接话，也分享自己的日常']],
[3,'约会后你觉得很开心，你通常怎样表达？','不用考虑哪种表达更讨喜。',['藏在心里，让TA自己感受','说一句今天还不错','具体说出自己喜欢的时刻','表达开心，也说想再见面']],
[4,'遇到一个相处愉快的人，你会怎样决定是否进一步发展？','只考虑你也有兴趣的对象。',['有心动就愿意先试着交往','了解几次，感觉合适就推进','观察一段时间，看价值观和行为','需要经过较长时间、多种情境的确认']],
[5,'喜欢的人临时约你，但你已经安排了独处时间。你倾向于？','假设这不是紧急或特殊情况。',['通常会改计划，优先见TA','多数时候会调整自己的安排','看当天状态，尽量保留部分计划','保持原计划，另约合适时间']],
[0,'一个你感兴趣的新朋友向你提问，你通常？','回想初次接触时的状态。',['简短回答，等下一个问题','礼貌回答，不太会反问','回答后也问问对方','主动展开，找彼此都舒服的话题']],
[1,'想念喜欢的人时，你更常怎么做？','按平时表现选择。',['不会表现出来','发一条只有自己知道含义的动态','找个理由联系TA','直接说想聊聊或想见TA']],
[2,'对方已经主动约了你两次，你也都很开心。接下来你会？','假设你愿意继续了解对方。',['继续等TA安排','暗示自己最近有空','提出可以一起做的事情','主动发出一次具体邀请']],
[3,'你忙了一整天，暂时没有心力聊天，会怎样处理？','不以随时在线为标准。',['直接沉默，等状态好了再说','简单说自己有事','说明在忙，之后再联系','说明状态和大概能聊的时间']],
[4,'对一个人心动后，你通常还需要确认哪些事？','选择与你最接近的观察程度。',['先跟着感觉走，之后慢慢了解','确认彼此都有兴趣即可','会了解价值观和关系期待','还要看压力、分歧和日常中的表现']],
[5,'刚进入暧昧期，你的周末一般会？','考虑你实际的时间安排。',['大部分时间围绕对方安排','经常为了见面调整原有安排','保留原来的安排，也留时间给TA','基本保持原节奏，提前协商见面']],
[0,'和心动对象结束一次愉快聊天时，你更可能？','不把任何一种反应当成对错。',['匆匆结束，不多表示','礼貌道别，等下次碰见','说今天聊得很开心','表达欢迎TA下次再来找自己']],
[1,'对方开玩笑问“你是不是对我有点特别”，你确实有好感，会？','假设你觉得这个问题没有冒犯。',['立刻否认，怕被看穿','含糊带过，不承认也不否认','用轻松的话回应一点真实心意','坦然承认，表达想继续了解']],
[2,'你拒绝了喜欢的人的某次邀约，因为时间冲突。你通常？','关注你是否帮助下一次互动发生。',['只说去不了','解释原因，但不接着安排','告诉TA另一个有空的时间','提出可行时间，也一起商量活动']],
[3,'对方的某个玩笑让你不舒服，你倾向于？','清楚表达边界也是一种情绪可读。',['表面没事，心里拉开距离','语气变淡，让TA察觉','直接说这个玩笑让我不太舒服','说明感受，也说希望怎样相处']],
[4,'你们互有好感，对方提出确认关系。你更接近哪种状态？','假设对方尊重你的意愿。',['有好感就愿意答应','简单聊聊彼此期待后答应','需要再观察一段时间','需要把关键期待和顾虑都确认清楚']],
[5,'开始喜欢一个人后，你原本的爱好和社交会怎样变化？','选择变化程度，不评价独立与依赖。',['明显减少，更多时间留给TA','会减少一些，优先顾及见面','大致照常，适当协调','稳定保留，关系融入已有生活']],
[0,'面对一个你愿意了解、但还不熟的人，你的身体语言通常是？','可按你最常见的表现作答。',['较少眼神接触，也不太接话','保持礼貌，等对方带动','会微笑、看着对方回应','自然表达兴趣，让TA感到被欢迎']],
[1,'如果朋友问你“对方知道你喜欢TA吗”，你觉得？','以你已经表达出的行为为依据。',['应该完全不知道','也许能猜到一点，但没有明显线索','从我的偏爱里大概能看出来','我已经用清楚的话或邀请表达过']],
[2,'你们的聊天自然停下来几天，而你仍然想了解TA，会？','假设没有矛盾，也没有被拒绝。',['等TA来找我','发动态，看看TA会不会回应','找到有趣的话题主动联系','直接发起聊天或提出见面']],
[3,'你想慢慢了解，不想太快推进关系，会如何表达？','关注是否让对方理解你的真实想法。',['少回复，让关系自然慢下来','说最近忙，先避开这个话题','说自己需要更多相处时间','表达有兴趣，同时说明自己的节奏']],
[4,'决定认真交往前，你对“还没了解的部分”通常怎么看？','选择你真实能接受的不确定性。',['可以交往后一起了解','大方向合适就能接受一些未知','重要方面需要先了解清楚','需要较充分了解，才有把握进入关系']],
[5,'理想的恋爱关系里，你希望两个人的生活如何交织？','这里衡量生活安排，不衡量爱得深浅。',['尽可能一起活动，日程高度重合','多数事情一起做，保留少量个人时间','共同生活与各自空间大致平衡','各有稳定生活，再有意识地相聚']]
];
const questions=raw.map((q,i)=>({...{dim:q[0],title:q[1],hint:q[2]},options:q[3].map((t,v)=>({text:t,value:v})).sort((a,b)=>((a.value+i*2)%4)-((b.value+i*2)%4))}));
const types=[['藏糖猫系','你的喜欢，往往藏在细节里。','在意可以很轻，也可以让对方听见。'],['清醒守门员','你需要确认，也愿意把边界说清楚。','认真选择，也值得被认真靠近。'],['自由行星型','你拥有自己的轨道，也为相遇留出空间。','好的相遇，是两种生活慢慢交汇。'],['友好谜面型','你让人容易靠近，却不容易看懂偏爱。','让你的特别，偶尔也特别明显。'],['明朗直球型','你的心意有方向，互动也有来有回。','不必猜来猜去，喜欢本来可以清楚。'],['渐暖观察型','你在相处中确认心意，让关系慢慢升温。','慢一点也没关系，记得留下回音。']];
function calculate(ans){let v=dims.map((_,d)=>Math.round(questions.reduce((s,q,i)=>s+(q.dim===d?ans[i]:0),0)/12*100));let [a,b,c,d,e,f]=v;let score=Math.round(.15*(100-a)+.25*(100-b)+.2*(100-c)+.15*(100-d)+.15*e+.1*f);let type=b<=40&&c<=45?0:e>=65&&d>=55?1:f>=70&&b>=45?2:a>=65&&b<=45?3:b>=65&&c>=65?4:5;return {v,score,type};}
let state={answers:[],index:0,view:'home'};try{let saved=JSON.parse(localStorage.getItem('love-signals-v1'));if(saved&&Array.isArray(saved.answers)&&saved.answers.length<=24&&saved.answers.every(x=>x===null||Number.isInteger(x)&&x>=0&&x<=3)){state={...state,...saved};if(!['home','quiz','result'].includes(state.view))state.view='home';state.index=Math.max(0,Math.min(23,state.index||0));if(state.view==='result'&&!complete())state.view='home'}}catch(e){}
let demo=false;const app=document.querySelector('#app');function complete(){return state.answers.length===24&&Array.from(state.answers).every(x=>Number.isInteger(x)&&x>=0&&x<=3)}function save(){try{localStorage.setItem('love-signals-v1',JSON.stringify(state))}catch(e){}}function move(view){state.view=view;save();render();scrollTo(0,0)}function header(){return '<header><span class="brand">心动观察室</span><span class="tiny">LOVE SIGNALS</span></header>'}function footer(){return '<div class="footer">仅供娱乐与自我探索，非专业心理测评<br>答案仅保存在当前浏览器</div>'}function render(){app.innerHTML=header()+(state.view==='home'?home():state.view==='quiz'?quiz():report())+footer();bind()}
function home(){return `<div class="eyebrow">A LITTLE CLOSER TO YOU</div><h1>你到底<br>有多难追？</h1><p class="intro-copy muted">你的喜欢，别人真的接收到了吗？</p><div class="card wash center"><div class="orb"></div><h2>每一份心动，都有自己的信号。</h2><p class="muted">从六个维度，看看别人靠近你时，<br>会经历什么。</p><div class="chips"><span class="chip">24 个生活情境</span><span class="chip">约 3—5 分钟</span></div></div><div class="mini-signals">${dims.map(d=>`<div>${d}</div>`).join('')}</div><button class="primary" id="start">${state.answers.some(x=>x!=null)?'继续我的测试':'发现我的恋爱信号'}</button><div class="center"><button class="link" id="demo">先看看报告效果</button></div><p class="tiny center">按你最自然的反应作答，就已经足够。<br>没有恋爱经历，也可以根据有好感时的想象选择。</p>`}
function quiz(){const q=questions[state.index];return `<div class="topline"><span class="tiny">发现你的恋爱信号</span><span class="tiny">${String(state.index+1).padStart(2,'0')} / 24</span></div><div class="progress" style="margin-top:14px"><div style="width:${(state.index+1)/24*100}%"></div></div><h1 class="question">${q.title}</h1><p class="tiny">${q.hint}</p><div>${q.options.map((o,i)=>`<button class="option ${state.answers[state.index]===o.value?'selected':''}" aria-pressed="${state.answers[state.index]===o.value}" data-value="${o.value}"><span class="letter">${'ABCD'[i]}</span><span>${o.text}</span></button>`).join('')}</div><div class="actions"><button class="secondary" id="prev">${state.index?'上一题':'返回首页'}</button><button class="primary" id="next" ${state.answers[state.index]==null?'disabled':''}>${state.index===23?'查看我的报告':'下一题'}</button></div><p class="tiny center">按实际感受选择，无需选“更好”的答案。</p>`}
function radar(v){const point=(i,n,r=110)=>{let a=(i*60-90)*Math.PI/180;return [190+Math.cos(a)*r*n/100,190+Math.sin(a)*r*n/100]};let poly=n=>dims.map((_,i)=>point(i,n).join(',')).join(' ');return `<svg class="radar" viewBox="0 0 380 380" role="img" aria-label="六维恋爱信号：${dims.map((d,i)=>d+v[i]+'分').join('，')}"><defs><linearGradient id="radarFill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8e9bf0" stop-opacity=".52"/><stop offset="1" stop-color="#eab4dc" stop-opacity=".45"/></linearGradient></defs>${[100,80,60,40,20].map(n=>`<polygon points="${poly(n)}" fill="${n===100?'#e8eaff55':'none'}" stroke="#b7b7db" stroke-opacity=".4"/>`).join('')}${dims.map((_,i)=>{let p=point(i,100);return `<line x1="190" y1="190" x2="${p[0]}" y2="${p[1]}" stroke="#c9c7df" stroke-opacity=".55"/>`}).join('')}${[20,40,60,80,100].map(n=>`<text x="196" y="${190-110*n/100+13}" font-size="9" fill="#9390ab">${n}</text>`).join('')}<polygon points="${v.map((n,i)=>point(i,n).join(',')).join(' ')}" fill="url(#radarFill)" stroke="#8582d6" stroke-width="2"/>${v.map((n,i)=>{let p=point(i,n);return `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#8c84d8" stroke="white" stroke-width="2"/>`}).join('')}${dims.map((d,i)=>{let p=point(i,100,159);return `<text x="${p[0]}" y="${p[1]-3}" text-anchor="middle" fill="#59536e" font-size="13">${d}<tspan x="${p[0]}" dy="20" font-weight="600" fill="#7b72b5">${v[i]}</tspan></text>`}).join('')}</svg>`}
const band=n=>n<40?0:n<65?1:2;const stages=[['第一眼',['需要一点勇气，才敢开启对话','有合适话题，就能慢慢靠近','自然的回应，让人愿意开口']],['聊起来',['互动节奏还需要慢慢摸索','熟悉之后，会逐渐聊得开','有来有回，相处容易找到节奏']],['有好感后',['你的偏爱，可能需要更多提示','能感到特别，还想再确认一点','心意有方向，不必反复猜测']],['真正熟了',['原来你的在意，要在细节里慢慢发现','慢慢看见你的偏爱，也理解你的节奏','心意和边界都清楚，相处更有默契']]];
const reasonTitles=['第一步不易开启','好感信号比较含蓄','互动回声偏少','真实想法不易读懂','进入关系需要更多确认','个人生活节奏比较稳定'];const reasonTexts=['按你的回答，初识时你较少主动释放欢迎信号，对方可能不确定能否接近。','你的在意可能藏在细节里，对方未必能把这些细节与好感联系起来。','即使你愿意继续了解，也可能较少主动延续互动，让对方不确定是否双向。','你可能习惯先自己消化感受，对方需要更多沟通才能理解你的态度。','你倾向于先观察再决定，推进较快的人可能误解为你没有兴趣。','你珍惜原有安排，对方可能需要通过协商，找到适合双方的见面节奏。'];
function relationshipCards(v,type){
const profiles=[
{away:'逼你当场表态的人',why:'当好感还没有被你整理清楚，就被要求立刻给出答案，你可能会把原本想表达的心意收回去。',near:'耐心沟通、懂得确认的人',how:'愿意留意你的细节，也会温和地询问，而不是把沉默当作默许。明确邀请、尊重回答，更容易建立信任。',hook:'细腻观察型',attract:'你的偏爱不张扬，记住一个小细节、悄悄照顾一次感受，可能会让重视细节的人觉得自己被认真放在心上。'},
{away:'跳过了解、急着要承诺的人',why:'你在意长期相处是否合适。还没有足够了解就被推动确认关系，可能让你感觉自己的判断空间没有被尊重。',near:'言行一致、尊重节奏的人',how:'稳定地兑现约定，愿意讨论价值观与关系期待，让你通过相处确认彼此，而不是依靠一时热烈。',hook:'认真投入型',attract:'你的选择谨慎、边界清楚，可能吸引同样看重承诺的人；你愿意认真了解的态度，会让关系显得踏实。'},
{away:'要求你随时围着TA转的人',why:'当个人时间、朋友和爱好被当成对关系不够投入的证据，你可能会因为空间被挤压而退后。',near:'有自己的生活、也愿意主动安排的人',how:'提前商量见面时间，尊重各自安排，也清楚表达想念。你更容易在自由且稳定的连接里靠近。',hook:'独立欣赏型',attract:'你有自己的兴趣、节奏和重心，可能让欣赏自主生活的人产生好奇；两种生活有意识地交汇，会更有吸引力。'},
{away:'把你的友好当成默认答应的人',why:'你愿意交流，不等于已经答应发展关系。未经确认就用亲密称呼或替你作决定，可能让你收回原本的轻松。',near:'表达清楚、会征求意愿的人',how:'坦诚说明自己的好感，用具体邀请了解你的意愿；既接得住你的友好，也能尊重你尚未确定的心意。',hook:'温暖互动型',attract:'你自然的回应和相处时的轻松感，可能让喜欢日常交流的人想继续靠近；只是友好是否意味着偏爱，仍需要确认。'},
{away:'故意制造拉扯、反复试探的人',why:'你习惯让心意有来有回。对方刻意冷淡、让你猜测或用嫉妒证明喜欢，可能会消耗你的热情。',near:'真诚、具体、行动一致的人',how:'喜欢就认真表达，约定就尽量兑现；有顾虑时及时沟通。清楚的回应更容易让你放心地继续投入。',hook:'坦率行动型',attract:'你表达清楚，也愿意主动回应，可能吸引珍惜确定感的人。无需反复猜测的互动，会让TA更期待下一次相处。'},
{away:'忽然加速、又忽然消失的人',why:'你更习惯在稳定相处中确认心意。关系节奏反复变化，可能让你难以建立信任，也不知道是否值得继续投入。',near:'稳定主动、愿意慢慢熟悉的人',how:'用持续的交流与具体邀约积累了解，允许彼此逐渐打开，也定期聊聊双方是否都愿意继续。',hook:'陪伴渐进型',attract:'你在熟悉后逐步展开的真实感，可能吸引喜欢慢慢了解一个人的人。每一次更自然的分享，都会让相处多一点连接。'}
];
let p={...profiles[type]};
if(v[4]>=65){p.away='逼你立刻确认关系的人';p.why='你需要通过观察和相处确认是否合适。越催你给承诺，越可能让你感到判断空间被压缩，转而收回好感。';}
else if(v[5]>=70){p.away='把占用时间当成爱意证明的人';p.why='你重视独立的生活节奏。如果对方要求随叫随到，或否定你的朋友和爱好，你可能会为了保留空间而退后。';}
return `<div class="card"><div class="eyebrow">最容易把你追跑</div><h3 style="margin-top:12px">${p.away}</h3><p class="muted"><b>为什么会退后：</b>${p.why}</p></div><div class="card"><div class="eyebrow">更容易追到你</div><h3 style="margin-top:12px">${p.near}</h3><p class="muted"><b>为什么更容易靠近：</b>${p.how}</p><p class="tiny">前提是你也有兴趣，舒服的相处不等于一定会产生好感。</p></div><div class="card wash"><div class="eyebrow">最容易对你上头的人</div><h3 style="margin-top:12px">${p.hook}</h3><p class="muted"><b>可能被你吸引的原因：</b>${p.attract}</p><p class="tiny">这是基于你的互动风格作出的趣味推测，不能预测某个人的真实感受。</p></div>`;
}
function resultData(){return demo?{v:[46,36,35,42,58,55],score:60,type:0}:calculate(state.answers)}
function report(){if(!demo&&!complete())return home();let {v,score,type}=resultData(),t=types[type];let blockers=v.map((n,i)=>({i,n:i<4?100-n:n})).sort((a,b)=>b.n*[.15,.25,.2,.15,.15,.1][b.i]-a.n*[.15,.25,.2,.15,.15,.1][a.i]).slice(0,3);let labels=['心意很好懂','靠近有回音','需要一点耐心','靠近需要默契','关系入口比较窄'];let label=labels[score<25?0:score<45?1:score<65?2:score<80?3:4];let special=type===0?'你更习惯把在意藏在细节里，表达未必能被直接识别。':type===1?'你会观察是否合适，也愿意让对方了解你的边界。':type===2?'你为自己的生活保留空间，也会给心动留出表达的机会。':type===3?'你对人友好，但普通的礼貌与特别的偏爱可能不容易区分。':type===4?'你愿意表达心意，也愿意用行动接住对方的主动。':'你会在相处中逐渐确认自己的心意，不急着给关系下结论。';let retreat=v[4]>=65?'被催促立刻确认关系':v[5]>=70?'被要求随时放下自己的安排':v[1]<=40?'在公开场合被突然追问心意':'用忽冷忽热来试探你的态度';return `${demo?'<div class="demo-banner">示例报告 · 仅展示效果，不代表你的实际结果</div>':''}<div class="eyebrow">YOUR PURSUIT DIFFICULTY</div><div class="card wash center"><p>你的难追指数</p><div class="score">${score}<small> /100</small></div><span class="badge">${label}</span><p class="tiny" style="margin-top:20px">分数越高，表示按你的自述，<br>别人可能需要更多确认才能推进关系。</p></div><div class="card" style="background:linear-gradient(125deg,#f3e3ef,#fbf6fa)"><div class="eyebrow">你的恋爱原型</div><h2 class="archetype">${t[0]}</h2><p class="muted">${t[1]}</p><p>${special}你的好感信号为 ${v[1]} 分，互动回声为 ${v[2]} 分；这些是本次回答所呈现的互动倾向。适合的节奏可以一起商量，你也可以用一两句具体的话，让对方更容易理解你的真实想法。</p><p class="quote">“${t[2]}”</p></div><section class="section"><h2>别人靠近你时的四阶段体感</h2><div class="grid">${stages.map((s,i)=>`<div class="stage"><span>${s[0]}</span><strong>${s[1][band([v[0],(v[2]+v[3])/2,v[1],(v[1]+v[2]+v[3])/3][i])]}</strong></div>`).join('')}</div></section><section class="section"><h2><span class="section-label">01</span>你的六维恋爱信号</h2><div class="radar-card">${radar(v)}<p class="note">前四项反映互动信号的清晰程度，后两项反映筛选与个人节奏，不代表好坏。</p></div>${dims.map((d,i)=>`<div class="row"><div class="row-head"><span>${d}</span><b>${v[i]}</b></div><div class="track"><div class="fill" style="width:${v[i]}%"></div></div><div class="description">${desc[i]}</div></div>`).join('')}</section><section class="section"><h2><span class="section-label">02</span>为什么别人会觉得你难追</h2>${blockers.length?blockers.map((x,j)=>`<div class="card reason"><span class="number">${String(j+1).padStart(2,'0')}</span><div><h3>${x.n>=55?reasonTitles[x.i]:['初识时仍需一个开场','偏爱有时需要再确认','主动的节奏需要协调','感受仍需要说出来','关系期待需要对齐','生活安排需要磨合'][x.i]}</h3><p>${x.n>=55?reasonTexts[x.i]:'这一项并不是你明显的阻力；在关系初期，仍可留意：'+['对方是否知道你欢迎聊天。','你的友好是否被误读成普通礼貌。','你是否也在主动发起互动。','你的真实感受是否被清楚表达。','双方对确认关系的时间期待是否一致。','彼此的见面时间是否方便协调。'][x.i]}</p></div></div>`).join(''):'<div class="card"><h3>你的互动信号整体比较清晰</h3><p class="muted">继续表达真实感受，也给彼此保留选择和确认的空间。</p></div>'}</section><section class="section"><h2><span class="section-label">03</span>让相处更顺畅一点</h2>${relationshipCards(v,type)}<div class="card"><div class="eyebrow">给你自己的一个小行动</div><h3 style="margin-top:12px">${v[1]<=45?'让一点偏爱被听见':v[2]<=45?'主动接住一次邀请':'把舒服的节奏说出来'}</h3><p class="muted">${v[1]<=45?'下一次相处愉快时，试着说“今天和你聊天很开心，我想再见你”。只在你确实有兴趣时表达。':v[2]<=45?'想赴约但时间不合适时，主动给出另一个可行时间，让对方知道你也愿意继续。':'可以说“我想继续了解你，也希望每周给自己留一些时间”，把期待变成可以协商的安排。'}</p></div></section><div class="report-end"><button class="primary" id="download">保存我的信号卡片</button><div class="actions"><button class="secondary" id="restart" style="flex:1">${demo?'开始我的测试':'重新测试'}</button><button class="secondary" id="home">返回首页</button></div><p class="tiny center">难追程度不代表魅力，关系需要双方自愿。</p></div>`}
function bind(){document.querySelector('#start')?.addEventListener('click',()=>{demo=false;move('quiz')});document.querySelector('#demo')?.addEventListener('click',()=>{demo=true;state.view='result';render();scrollTo(0,0)});document.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{state.answers[state.index]=Number(b.dataset.value);save();render()});document.querySelector('#prev')?.addEventListener('click',()=>{if(state.index){state.index--;save();render();scrollTo(0,0)}else move('home')});document.querySelector('#next')?.addEventListener('click',()=>{if(state.answers[state.index]==null)return;if(state.index===23){if(complete())move('result')}else{state.index++;save();render();scrollTo(0,0)}});document.querySelector('#restart')?.addEventListener('click',()=>{demo=false;state={answers:[],index:0,view:'quiz'};save();render();scrollTo(0,0)});document.querySelector('#home')?.addEventListener('click',()=>{if(demo){demo=false;state.view='home';render();scrollTo(0,0)}else move('home')});document.querySelector('#download')?.addEventListener('click',download)}
function toast(t){let el=document.createElement('div');el.className='toast';el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),5000)}
function download(){let {v,score,type}=resultData();try{const c=document.createElement('canvas');c.width=1080;c.height=1480;const x=c.getContext('2d');let bg=x.createLinearGradient(0,0,1080,1480);bg.addColorStop(0,'#e5e9ff');bg.addColorStop(.7,'#f7e5f0');bg.addColorStop(1,'#faf6fc');x.fillStyle=bg;x.fillRect(0,0,1080,1480);x.textAlign='center';x.fillStyle='#6d6396';x.font='26px sans-serif';x.fillText('心动观察室 / LOVE SIGNALS',540,100);x.fillStyle='#343247';x.font='bold 48px sans-serif';x.fillText('你到底有多难追？',540,200);x.font='28px sans-serif';x.fillText('你的难追指数',540,280);x.font='bold 200px sans-serif';x.fillStyle='#7c79cb';x.fillText(String(score),540,480);x.font='26px sans-serif';x.fillText('/ 100',540,530);x.font='bold 60px sans-serif';x.fillStyle='#343247';x.fillText(types[type][0],540,655);x.font='27px sans-serif';x.fillText(types[type][2],540,725);let g=x.createLinearGradient(200,0,840,0);g.addColorStop(0,'#8796ef');g.addColorStop(1,'#b597e4');dims.forEach((d,i)=>{let y=825+i*75;x.textAlign='left';x.font='26px sans-serif';x.fillStyle='#514b65';x.fillText(d,150,y);x.textAlign='right';x.fillText(v[i],930,y);x.fillStyle='#e3ddea';x.fillRect(150,y+15,780,10);x.fillStyle=g;x.fillRect(150,y+15,780*v[i]/100,10)});x.textAlign='center';x.fillStyle='#77758b';x.font='22px sans-serif';x.fillText(demo?'示例报告 · 不代表你的实际结果':'难追程度不代表魅力，关系需要双方自愿。',540,1355);x.fillText('仅供娱乐与自我探索，非专业心理测评',540,1410);c.toBlob(blob=>{if(!blob){toast('生成失败，请截图保存报告');return}let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='我的恋爱信号.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('已生成图片；若浏览器未下载，可截图保存报告。')},'image/png')}catch(e){toast('图片生成失败，请截图保存报告。')}}render();
</script></body></html>
